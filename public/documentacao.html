<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documentação — Bom Beef</title>
<link rel="stylesheet" href="/css/bb-theme.css?v=7.0.3">
<script src="/js/api.js"></script>
<style>
:root{--red:#8b0000;--red-l:#c0392b;--green:#1a7a4a;--orange:#c76b00;--blue:#1a5c8a;--bg:#f7f4f0;--white:#fff;--text:#1a1a1a;--muted:#7a7068;--border:#e8e0d8;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}.body{padding:18px;overflow:auto;min-height:100vh}.intro{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.intro h1{font-size:18px;margin:0 0 4px}.intro p{font-size:12px;color:var(--muted);margin:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}.kpi.red{border-left-color:var(--red-l)}.kpi.orange{border-left-color:var(--orange)}.kpi.green{border-left-color:var(--green)}.kpi small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}.kpi strong{font-size:23px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px;box-shadow:var(--shadow)}.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.search{flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--border);border-radius:8px}.flt{padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff}.alert{padding:11px 13px;border-radius:8px;margin-bottom:12px;font-size:12px;font-weight:600}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.scroll{overflow:auto}.tbl{border-collapse:collapse;width:100%;min-width:850px}.tbl th{background:#faf7f4;text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:.5px;color:var(--muted);padding:10px}.tbl td{padding:9px 10px;border-top:1px solid #f1ebe5;font-size:12px}.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700}.empty{text-align:center;padding:32px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:94vh;overflow:auto;box-shadow:0 16px 50px rgba(0,0,0,.25)}.mh,.mf{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.mh h2{margin:0;font-size:16px;color:var(--red)}.mb{padding:18px}.mf{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}.fg input,.fg textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px}.full{grid-column:1/-1}@media(max-width:700px){.body{padding:12px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.intro{display:block}.intro .btn{margin-top:10px}.toolbar>*{width:100%}}
</style>
</head>
<body><main class="body">
  <div class="intro"><div><h1>📄 Documentação e licenças</h1><p>Certificados, laudos e documentos para nutricionista e fiscalizações.</p></div><button class="btn primary" onclick="abrirDocumento()">＋ Novo documento</button></div>
  <div class="kpis"><div class="kpi red"><small>Vencidos</small><strong id="k-vencidos">0</strong></div><div class="kpi orange"><small>Próximos do vencimento</small><strong id="k-alerta">0</strong></div><div class="kpi green"><small>Válidos</small><strong id="k-validos">0</strong></div><div class="kpi"><small>Total</small><strong id="k-total">0</strong></div></div>
  <div id="alertas"></div>
  <div class="toolbar"><input class="search" id="busca" placeholder="🔎 Buscar documento..." oninput="render()"><select class="flt" id="status" onchange="render()"><option value="">Todos os status</option><option value="vencido">Vencidos</option><option value="alerta">Próximos do vencimento</option><option value="valido">Válidos</option></select><button class="btn" onclick="carregar()">↻ Atualizar</button></div>
  <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Documento</th><th>Emissão</th><th>Validade</th><th>Dias</th><th>Status</th><th>Arquivo</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="empty" id="empty" style="display:none">📄 Nenhum documento cadastrado.</div></div>
</main>
<div class="modal-bg" id="modal"><div class="modal"><div class="mh"><h2 id="title">Novo documento</h2><button class="btn" onclick="fechar()">×</button></div><div class="mb"><input type="hidden" id="d-id"><div class="grid"><div class="fg full"><label>Nome do documento *</label><input id="d-nome" placeholder="Ex.: Licença Sanitária"></div><div class="fg"><label>Data de emissão</label><input type="date" id="d-emissao"></div><div class="fg"><label>Data de validade *</label><input type="date" id="d-validade"></div><div class="fg"><label>Alertar antes</label><input type="number" id="d-alerta" min="0" value="30"></div><div class="fg"><label>Anexar arquivo</label><input type="file" id="d-arquivo" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx"></div><div class="fg full"><label>Descrição / observação</label><textarea id="d-descricao" rows="3"></textarea></div></div><p style="font-size:11px;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;padding:9px;border-radius:8px">O arquivo é opcional e pode ser anexado posteriormente.</p></div><div class="mf"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn primary" id="salvar" onclick="salvarDocumento()">💾 Salvar documento</button></div></div></div>
<script>
let api,toast,documentos=[];
BB.modulo({nome:'documentacao',init:()=>{api=BB.api;toast=BB.toast;carregar()},reload:carregar,eventos:['validade_atualizado']});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=s=>{if(!s)return'—';const p=String(s).slice(0,10).split('-');return`${p[2]}/${p[1]}/${p[0]}`};
async function carregar(){const d=await api.get('/api/validade/documentos');if(!d.ok){toast('Erro ao carregar documentos');return}documentos=d.data||[];render()}
function render(){const q=document.getElementById('busca').value.toLowerCase(),st=document.getElementById('status').value;const lista=documentos.filter(d=>(!st||d.situacao===st)&&(!q||[d.nome,d.descricao,d.nome_arquivo].some(v=>String(v||'').toLowerCase().includes(q))));const venc=documentos.filter(d=>d.situacao==='vencido').length,alerta=documentos.filter(d=>d.situacao==='alerta').length;document.getElementById('k-vencidos').textContent=venc;document.getElementById('k-alerta').textContent=alerta;document.getElementById('k-validos').textContent=documentos.length-venc-alerta;document.getElementById('k-total').textContent=documentos.length;document.getElementById('alertas').innerHTML=(venc+alerta)?`<div class="alert" style="background:${venc?'#fef2f2':'#fffbeb'};border:1px solid ${venc?'#fecaca':'#fde68a'};color:${venc?'#991b1b':'#92400e'}">⚠️ ${venc} documento(s) vencido(s) e ${alerta} próximo(s) do vencimento.</div>`:'';const cor={vencido:['#fee2e2','#991b1b','Vencido'],alerta:['#fef3c7','#92400e','A vencer'],valido:['#dcfce7','#166534','Válido']};document.getElementById('tbody').innerHTML=lista.map(d=>{const c=cor[d.situacao]||cor.valido,n=Number(d.dias_restantes),dias=d.situacao==='vencido'?`${Math.abs(n)}d vencido`:n===0?'Hoje':`${n} dias`;return`<tr style="background:${d.situacao==='vencido'?'#fff5f5':d.situacao==='alerta'?'#fffbeb':'#fff'}"><td><strong>${esc(d.nome)}</strong>${d.descricao?`<div style="font-size:10px;color:var(--muted)">${esc(d.descricao)}</div>`:''}</td><td>${data(d.data_emissao)}</td><td><strong>${data(d.data_validade)}</strong></td><td>${dias}</td><td><span class="badge" style="background:${c[0]};color:${c[1]}">${c[2]}</span></td><td>${d.nome_arquivo?`<button class="btn" onclick="baixar(${d.id},'${String(d.nome_arquivo).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">📎 ${esc(d.nome_arquivo)}</button>`:'Somente cadastro'}</td><td><button class="btn" onclick="abrirDocumento(${d.id})">✏️</button> <button class="btn" style="color:#b91c1c" onclick="excluir(${d.id})">🗑</button></td></tr>`}).join('');document.getElementById('empty').style.display=lista.length?'none':''}
function abrirDocumento(id){const d=documentos.find(x=>String(x.id)===String(id));document.getElementById('title').textContent=d?'Editar documento':'Novo documento';document.getElementById('d-id').value=d?.id||'';document.getElementById('d-nome').value=d?.nome||'';document.getElementById('d-emissao').value=d?.data_emissao?String(d.data_emissao).slice(0,10):'';document.getElementById('d-validade').value=d?.data_validade?String(d.data_validade).slice(0,10):'';document.getElementById('d-alerta').value=d?.dias_alerta??30;document.getElementById('d-descricao').value=d?.descricao||'';document.getElementById('d-arquivo').value='';document.getElementById('modal').classList.add('open')}
function fechar(){document.getElementById('modal').classList.remove('open')}
async function salvarDocumento(){const nome=document.getElementById('d-nome').value.trim(),validade=document.getElementById('d-validade').value;if(!nome||!validade){toast('Preencha nome e validade');return}const b=document.getElementById('salvar');b.disabled=true;try{const fd=new FormData();fd.append('nome',nome);fd.append('dataEmissao',document.getElementById('d-emissao').value);fd.append('dataValidade',validade);fd.append('diasAlerta',document.getElementById('d-alerta').value||30);fd.append('descricao',document.getElementById('d-descricao').value.trim());const arq=document.getElementById('d-arquivo').files?.[0];if(arq)fd.append('arquivo',arq);const id=document.getElementById('d-id').value,d=await api.upload('/api/validade/documentos'+(id?'/'+id:''),fd,id?'PUT':'POST');if(!d.ok){toast('Erro: '+d.erro);return}fechar();await carregar();toast('✅ Documento salvo')}finally{b.disabled=false}}
async function baixar(id,nome){try{const r=await fetch(`/api/validade/documentos/${id}/download`,{headers:{Authorization:'Bearer '+api.token()}});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(_){toast('Erro ao baixar documento')}}
async function excluir(id){if(!confirm('Excluir este documento e o anexo?'))return;const d=await api.delete('/api/validade/documentos/'+id);if(!d.ok){toast('Erro: '+d.erro);return}await carregar();toast('✅ Documento excluído')}
</script></body></html>
