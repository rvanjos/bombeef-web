<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente Financeiro</title><link rel="stylesheet" href="/css/bb-base.css?v=1"><script src="/js/api.js"></script></head><body style="background:#f7f4f0"><main style="max-width:1100px;margin:auto;padding:18px"><header style="background:#8b0000;color:#fff;padding:18px;border-radius:16px"><h1 style="margin:0">💰 Agente Financeiro</h1><p>Coloque as faturas no Drive e importe o extrato. O agente processa o restante.</p><button id="proc">▶ Processar agora</button></header><section id="resumo" style="background:#fff;padding:14px;border-radius:12px;margin-top:12px">Pronto para processar.</section><section style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><div style="background:#fff;padding:14px;border-radius:12px"><h3>Pendências que precisam de você</h3><div id="pend">Nenhuma análise executada.</div></div><div style="background:#fff;padding:14px;border-radius:12px"><h3>Histórico das faturas</h3><div id="hist">Carregando...</div><details><summary>Detalhes técnicos</summary><a href="/agente-financeiro-importacao.html">Importação técnica</a></details></div></section></main><script>let a;const q=x=>document.getElementById(x);async function hist(){let r=await a.get('/api/dre/cartao-faturas'),d=r?.data||[];q('hist').innerHTML=d.length?d.slice(0,20).map(f=>'<p><b>'+f.cartao+' · '+f.competencia+'</b><br><small>R$ '+Number(f.valor_total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+' · '+(f.itens_total||0)+' itens · '+f.status+'</small></p>').join(''):'Nenhuma fatura importada.'}async function proc(){let b=q('proc');b.disabled=true;q('resumo').textContent='Processando...';let p=[],ok=0,it=0;try{let r=await a.get('/api/agente-financeiro/drive/arquivos?limit=100'),fs=r?.data||[];for(let f of fs){try{let x=await a.post('/api/agente-financeiro/drive/interpretar',{fileId:f.id}),v=x.preview||{};it+=Number(v.qtd_itens||0);if(!v.conferencia_ok){p.push(f.name+' — divergência');continue}ok++;try{await a.post('/api/agente-financeiro/drive/importar',{fileId:f.id,previewHash:v.preview_hash})}catch(e){}}catch(e){p.push(f.name+' — leitura pendente')}}q('resumo').textContent=fs.length+' faturas encontradas · '+ok+' conferidas · '+it+' lançamentos · '+p.length+' pendências';q('pend').innerHTML=p.length?p.map(x=>'<p>⚠️ '+x+'</p>').join(''):'Nenhuma pendência de leitura/importação.';await hist()}catch(e){q('resumo').textContent='Falha no processamento.'}b.disabled=false}addEventListener('DOMContentLoaded',async()=>{a=BB.api;try{await a.get('/auth/me')}catch{return location.href='/'}q('proc').onclick=proc;await hist()})</script></body></html>
