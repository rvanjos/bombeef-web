<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente Financeiro</title><link rel="stylesheet" href="/css/bb-base.css?v=1"><script src="/js/api.js"></script></head><body style="background:#f7f4f0"><main style="max-width:1100px;margin:auto;padding:18px"><header style="background:#8b0000;color:#fff;padding:18px;border-radius:16px"><h1 style="margin:0">💰 Agente Financeiro</h1><p>Coloque as faturas em PDF no Drive e importe o extrato. O agente processa o restante.</p><button id="proc">▶ Processar agora</button></header><section id="resumo" style="background:#fff;padding:14px;border-radius:12px;margin-top:12px">Pronto para processar.</section><section style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><div style="background:#fff;padding:14px;border-radius:12px"><h3>Pendências que precisam de você</h3><div id="pend">Nenhuma análise executada.</div></div><div style="background:#fff;padding:14px;border-radius:12px"><h3>Histórico das faturas</h3><div id="hist">Carregando...</div><details><summary>Detalhes técnicos</summary><a href="/agente-financeiro-importacao.html">Importação técnica</a></details></div></section></main><script>let a;const q=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function hist(){let r=await a.get('/api/dre/cartao-faturas'),d=r?.data||[];q('hist').innerHTML=d.length?d.slice(0,20).map(f=>'<p><b>'+esc(f.cartao)+' · '+esc(f.competencia)+'</b><br><small>R$ '+Number(f.valor_total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+' · '+(f.itens_total||0)+' itens · '+esc(f.status)+'</small></p>').join(''):'Nenhuma fatura importada.'}function pdf(f){return /pdf/i.test(String(f.mimeType||''))||/\.pdf$/i.test(String(f.name||''))}async function tratar(f){let x=await a.post('/api/agente-financeiro/drive/interpretar',{fileId:f.id});if(!x?.ok)return{tipo:'pend',nome:f.name,msg:x?.erro||'Formato ainda não suportado'};let v=x.preview||{};if(!v.conferencia_ok)return{tipo:'pend',nome:f.name,msg:'Divergência de R$ '+Math.abs(Number(v.diferenca||0)).toLocaleString('pt-BR',{minimumFractionDigits:2})};let imp=await a.post('/api/agente-financeiro/drive/importar',{fileId:f.id,previewHash:v.preview_hash});if(imp?.ok)return{tipo:'ok',nome:f.name,itens:Number(v.qtd_itens||0),msg:'Conferida e importada'};if(imp?.codigo==='FATURA_EXISTENTE')return{tipo:'ok',nome:f.name,itens:Number(v.qtd_itens||0),msg:'Já estava importada'};return{tipo:'pend',nome:f.name,msg:imp?.erro||'Não foi possível importar'}}async function proc(){let b=q('proc');b.disabled=true;b.textContent='Processando...';q('resumo').textContent='Buscando faturas em PDF no Drive...';q('pend').textContent='Analisando...';try{let r=await a.get('/api/agente-financeiro/drive/arquivos?limit=100');let todos=r?.data||[],fs=todos.filter(pdf),res=[];if(!fs.length){q('resumo').textContent='Nenhuma fatura PDF encontrada no Drive.';q('pend').textContent='Nenhuma pendência.';return}for(let i=0;i<fs.length;i+=3){q('resumo').textContent='Processando '+Math.min(i+3,fs.length)+' de '+fs.length+' faturas...';let lote=await Promise.all(fs.slice(i,i+3).map(async f=>{try{return await tratar(f)}catch(e){return{tipo:'pend',nome:f.name,msg:'Erro inesperado na leitura'}}}));res.push(...lote)}let oks=res.filter(x=>x.tipo==='ok'),ps=res.filter(x=>x.tipo==='pend'),it=oks.reduce((s,x)=>s+Number(x.itens||0),0);q('resumo').textContent=fs.length+' faturas PDF · '+oks.length+' processadas · '+it+' lançamentos · '+ps.length+' pendências';q('pend').innerHTML=ps.length?ps.map(x=>'<p>⚠️ <b>'+esc(x.nome)+'</b><br><small>'+esc(x.msg)+'</small></p>').join(''):'✅ Nenhuma pendência de leitura/importação.';await hist()}catch(e){q('resumo').textContent='Falha ao acessar o Drive. Tente novamente.';q('pend').textContent='O processamento não foi concluído.'}finally{b.disabled=false;b.textContent='▶ Processar agora'}}addEventListener('DOMContentLoaded',async()=>{a=BB.api;try{await a.get('/auth/me')}catch{return location.href='/'}q('proc').onclick=proc;await hist()})</script></body></html>
