<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente Financeiro — Faturas</title>
<link rel="stylesheet" href="/css/bb-base.css?v=1"><script src="/js/api.js"></script>
<style>
:root{--vinho:#8b0000;--bg:#f7f4f0;--line:#e7dfd7;--muted:#766d66;--ok:#157347;--erro:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#241e1a}.wrap{max-width:1120px;margin:auto;padding:18px}.top{background:linear-gradient(120deg,#620000,var(--vinho));color:white;border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.top p{font-size:12px;margin:4px 0 0;opacity:.85}.top a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:9px 12px;font-size:11px}.box{background:white;border:1px solid var(--line);border-radius:13px;margin-top:14px;overflow:hidden}.boxh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.boxb{padding:13px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--vinho);color:white}.btn.sec{background:white;color:var(--vinho);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{font-size:10px;padding:4px 8px;border-radius:999px}.ok{background:#e9f6ef;color:var(--ok)}.bad{background:#fdeceb;color:var(--erro)}.muted{font-size:10px;color:var(--muted)}.files{display:grid;gap:8px;margin-top:10px}.file{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}.file .txt{flex:1;min-width:0}.file b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}.kpi small{font-size:9px;color:var(--muted);text-transform:uppercase}.kpi strong{display:block;margin-top:4px;font-size:16px}.cartao{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}.cartao h3{margin:0;padding:10px 12px;background:#faf8f5;font-size:12px;display:flex;justify-content:space-between}.table{overflow:auto;max-height:350px}table{border-collapse:collapse;width:100%;font-size:10px}th,td{padding:7px 8px;border-bottom:1px solid #f0ebe6;text-align:left}th{position:sticky;top:0;background:#fff}.desc{min-width:280px}.credito{color:var(--ok)}.alert{margin-top:10px;padding:11px;border-radius:9px;background:#fdeceb;color:var(--erro);font-size:11px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.top a{margin-left:0}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div style="font-size:27px">💳</div><div><h1>Agente Financeiro — Faturas de cartão</h1><p>Drive → leitura do PDF → conferência matemática → importação</p></div><a href="/agente-financeiro-semanal.html">← Fechamento semanal</a></header>
<section class="box"><div class="boxh"><strong>Faturas no Google Drive</strong><span id="drive" class="muted">Verificando...</span></div><div class="boxb"><button id="buscar" class="btn">Atualizar faturas</button> <span id="msg" class="muted"></span><div id="files" class="files"></div></div></section>
<section id="preview" class="box" style="display:none"><div class="boxh"><strong>Prévia conferida</strong><span id="conf"></span></div><div class="boxb"><div id="resumo" class="grid"></div><div id="cartoes"></div><div class="actions"><button id="importar" class="btn" disabled>Importar fatura conferida</button><button id="cancelar" class="btn sec">Cancelar</button><span class="muted">Nada é gravado antes desta confirmação.</span></div></div></section>
</main>
<script>
let api=null, atual=null;const $=id=>document.getElementById(id);const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function iniciar(){api=window.BB?.api;if(!api)return location.href='/';try{await api.get('/auth/me')}catch{return location.href='/'}$('buscar').onclick=listar;$('cancelar').onclick=()=>{$('preview').style.display='none';atual=null};$('importar').onclick=importar;await status();await listar()}
async function status(){try{const r=await api.get('/api/agente-financeiro/drive/status');$('drive').textContent=r?.conectado?'Drive conectado':'Drive indisponível';$('drive').className='pill '+(r?.conectado?'ok':'bad')}catch{$('drive').textContent='Erro de conexão';$('drive').className='pill bad'}}
async function listar(){const box=$('files');box.innerHTML='<div class="empty">Buscando faturas...</div>';$('msg').textContent='';try{const r=await api.get('/api/agente-financeiro/drive/arquivos?limit=100');const fs=Array.isArray(r?.data)?r.data:[];if(!fs.length){box.innerHTML='<div class="empty">Nenhuma fatura encontrada.</div>';return}box.innerHTML=fs.map(f=>`<div class="file"><span>📄</span><div class="txt"><b>${esc(f.name)}</b><span class="muted">${f.size?Math.round(Number(f.size)/1024)+' KB':''}</span></div><button class="btn sec" data-id="${esc(f.id)}">Analisar</button></div>`).join('');box.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>analisar(b.dataset.id))}catch(e){box.innerHTML='<div class="alert">Falha ao listar faturas.</div>'}}
async function analisar(fileId){$('msg').textContent='Lendo PDF e conferindo lançamentos...';$('preview').style.display='none';try{const r=await api.post('/api/agente-financeiro/drive/interpretar',{fileId});if(!r?.ok)throw new Error(r?.erro||'Falha na leitura');atual={fileId,preview:r.preview};render(r.preview);$('msg').textContent=`Leitura concluída: ${r.preview.metodo_extracao||'leitor padrão'}.`}catch(e){$('msg').textContent=e?.message||'Não foi possível interpretar a fatura.'}}
function render(p){$('preview').style.display='block';$('conf').innerHTML=p.conferencia_ok?'<span class="pill ok">Total conferido</span>':'<span class="pill bad">Divergência</span>';const dados=[['Banco',p.banco],['Competência',p.competencia],['Vencimento',p.vencimento?.split('-').reverse().join('/')],['Total',brl(p.valor_total_fatura)],['Lançamentos',p.qtd_itens],['Leitor',p.metodo_extracao||'—']];$('resumo').innerHTML=dados.map(d=>`<div class="kpi"><small>${esc(d[0])}</small><strong>${esc(d[1])}</strong></div>`).join('');$('cartoes').innerHTML=(p.cartoes||[]).map(c=>`<section class="cartao"><h3><span>${esc(c.cartao)}</span><span>${c.qtd_itens} itens • ${brl(c.valor_total)}</span></h3><div class="table"><table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${(c.itens||[]).map(i=>`<tr><td>${esc(i.data_original||'—')}</td><td class="desc">${esc(i.descricao)}</td><td>${esc(i.tipo)}</td><td class="${Number(i.valor)<0?'credito':''}">${brl(i.valor)}</td></tr>`).join('')}</tbody></table></div></section>`).join('');if(!p.conferencia_ok)$('cartoes').insertAdjacentHTML('beforeend',`<div class="alert">Importação bloqueada. Soma encontrada: ${brl(p.soma_itens)}. Total da fatura: ${brl(p.valor_total_fatura)}. Diferença: ${brl(p.diferenca)}.</div>`);$('importar').disabled=!p.conferencia_ok}
async function importar(){if(!atual?.preview?.conferencia_ok)return;if(!confirm('Importar esta fatura conferida?'))return;$('importar').disabled=true;$('msg').textContent='Importando...';try{const r=await api.post('/api/agente-financeiro/drive/importar',{fileId:atual.fileId,previewHash:atual.preview.preview_hash});if(!r?.ok)throw new Error(r?.erro||'Falha na importação');$('msg').textContent=`Importação concluída: ${r.importadas?.length||0} cartão(ões), ${r.qtd_itens||0} lançamentos.`;await listar()}catch(e){$('msg').textContent=e?.message||'Falha na importação.';$('importar').disabled=false}}
window.addEventListener('DOMContentLoaded',iniciar);
</script></body></html>
