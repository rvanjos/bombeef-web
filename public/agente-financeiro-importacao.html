<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente Financeiro — Importar fatura</title>
<link rel="stylesheet" href="/css/bb-base.css?v=1"><script src="/js/api.js"></script>
<style>
:root{--wine:#8b0000;--bg:#f7f4f0;--line:#e7dfd7;--muted:#756b64;--ok:#167447;--bad:#b42318;--warn:#a56200}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#241e1a}.wrap{max-width:1180px;margin:auto;padding:18px}.head{background:linear-gradient(120deg,#5d0000,var(--wine));color:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px}.head h1{font-size:20px;margin:0}.head p{font-size:12px;margin:4px 0 0;color:#f2dede}.head a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:9px 12px;font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;margin-top:14px}.ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.body{padding:13px}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--wine);color:#fff}.btn.secondary{background:#fff;color:var(--wine);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:10px;padding:4px 8px;border-radius:999px}.ok{background:#e9f6ef;color:var(--ok)}.bad{background:#fdeceb;color:var(--bad)}.warn{background:#fff4db;color:var(--warn)}.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}.file .info{flex:1;min-width:0}.file b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file small,.muted{font-size:10px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}.kpi small{font-size:9px;color:var(--muted);text-transform:uppercase}.kpi strong{display:block;font-size:17px;margin-top:4px}.card{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}.cardh{padding:10px 12px;background:#faf8f5;display:flex;justify-content:space-between}.table{overflow:auto;max-height:360px}table{border-collapse:collapse;width:100%;font-size:10px}th,td{padding:7px 8px;border-bottom:1px solid #f0ebe6;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fff}.desc{white-space:normal;min-width:250px}.credito{color:var(--ok)}.erro{padding:12px;border-radius:9px;background:#fdeceb;color:var(--bad);font-size:11px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:750px){.summary{grid-template-columns:1fr 1fr}.head{flex-wrap:wrap}.head a{margin-left:0}}
</style>
</head>
<body><div class="wrap">
<header class="head"><div style="font-size:28px">💳</div><div><h1>Agente Financeiro — Importação de fatura</h1><p>Drive → interpretação → conferência → importação segura</p></div><a href="/agente-financeiro-semanal.html">← Fechamento semanal</a></header>
<section class="panel"><div class="ph"><strong>Google Drive — Faturas</strong><span id="driveStatus" class="muted">Verificando...</span></div><div class="body"><div class="bar"><button class="btn" id="buscar">Buscar faturas</button><span id="msg" class="muted"></span></div><div id="files"></div></div></section>
<section class="panel" id="previewPanel" style="display:none"><div class="ph"><strong>Prévia da fatura</strong><span id="conf"></span></div><div class="body"><div class="summary" id="summary"></div><div id="cards"></div><div class="bar" style="margin-top:14px"><button class="btn" id="importar" disabled>Importar fatura conferida</button><button class="btn secondary" id="cancelar">Cancelar prévia</button><span class="muted">Nenhuma importação é feita antes desta confirmação.</span></div></div></section>
</div>
<script>
let api,current=null;const $=x=>document.getElementById(x), brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){api=new ApiClient();try{await api.get('/auth/me')}catch(e){location.href='/'};await status();$('buscar').onclick=buscar;$('cancelar').onclick=()=>{current=null;$('previewPanel').style.display='none'};$('importar').onclick=importar}
async function status(){try{const r=await api.get('/api/agente-financeiro/drive/status');$('driveStatus').textContent=r?.conectado?'Drive conectado':'Drive não conectado';$('driveStatus').className='status '+(r?.conectado?'ok':'bad');if(!r?.conectado)$('msg').textContent=r?.erro||'Confira a configuração do Drive.'}catch(e){$('driveStatus').textContent='Falha de conexão';$('driveStatus').className='status bad'}}
async function buscar(){const box=$('files');box.innerHTML='<div class="empty">Buscando...</div>';$('msg').textContent='';try{const r=await api.get('/api/agente-financeiro/drive/arquivos?limit=50');const fs=Array.isArray(r?.data)?r.data:[];if(!fs.length){box.innerHTML='<div class="empty">Nenhuma fatura encontrada.</div>';return}box.innerHTML=fs.map(f=>`<div class="file"><span>📄</span><div class="info"><b>${esc(f.name)}</b><small>${f.size?Math.round(Number(f.size)/1024)+' KB':''}</small></div><button class="btn secondary" onclick="analisar('${esc(f.id)}')">Analisar fatura</button></div>`).join('')}catch(e){box.innerHTML='<div class="erro">Não foi possível listar as faturas.</div>'}}
async function analisar(id){$('msg').textContent='Interpretando PDF e conferindo valores...';$('previewPanel').style.display='none';try{const r=await api.post('/api/agente-financeiro/drive/interpretar',{fileId:id});if(!r?.ok)throw new Error(r?.erro||'Falha na interpretação');current={fileId:id,preview:r.preview};render(r.preview);$('msg').textContent='Prévia concluída.'}catch(e){$('msg').textContent=e?.message||'Falha ao interpretar a fatura.'}}
function render(p){$('previewPanel').style.display='block';$('conf').innerHTML=p.conferencia_ok?'<span class="status ok">Total conferido</span>':'<span class="status bad">Divergência de total</span>';$('summary').innerHTML=[['Banco',p.banco],['Competência',p.competencia],['Vencimento',p.vencimento?.split('-').reverse().join('/')],['Total da fatura',brl(p.valor_total_fatura)],['Lançamentos',p.qtd_itens]].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join('');$('cards').innerHTML=(p.cartoes||[]).map(c=>`<div class="card"><div class="cardh"><strong>${esc(c.cartao)}</strong><span>${c.qtd_itens} itens • ${brl(c.valor_total)}</span></div><div class="table"><table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${c.itens.map(i=>`<tr><td>${esc(i.data_original||'—')}</td><td class="desc">${esc(i.descricao)}</td><td>${esc(i.tipo)}</td><td class="${i.valor<0?'credito':''}">${brl(i.valor)}</td></tr>`).join('')}</tbody></table></div></div>`).join('');if(!p.conferencia_ok)$('cards').insertAdjacentHTML('beforeend',`<div class="erro" style="margin-top:10px">Importação bloqueada: soma dos itens ${brl(p.soma_itens)}; total da fatura ${brl(p.valor_total_fatura)}; diferença ${brl(p.diferenca)}.</div>`);$('importar').disabled=!p.conferencia_ok}
async function importar(){if(!current||!current.preview?.conferencia_ok)return;if(!confirm('Importar esta fatura e seus lançamentos conferidos para o sistema?'))return;$('importar').disabled=true;$('msg').textContent='Importando...';try{const r=await api.post('/api/agente-financeiro/drive/importar',{fileId:current.fileId,previewHash:current.preview.preview_hash});if(!r?.ok)throw Object.assign(new Error(r?.erro||'Falha na importação'),{data:r});$('msg').textContent=`Importação concluída: ${r.importadas?.length||0} cartão(ões), ${r.qtd_itens||0} lançamentos.`;setTimeout(()=>location.href='/agente-financeiro-semanal.html',900)}catch(e){$('importar').disabled=false;$('msg').textContent=e?.message||'Não foi possível importar. Se já houver fatura dessa competência, o sistema bloqueia a duplicidade.'}}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
